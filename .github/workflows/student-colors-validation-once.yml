name: Validar colores sincronizados en modo alumno (temporal)
on:
  push:
    branches: [feat/student-category-colors-20261121]
    paths: [.github/workflows/student-colors-validation-once.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JS, SW y regenerar manifiesto SHA-256
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/sw.js
          node --check app/tests/v126_student_category_colors.test.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Ejecutar todas las pruebas de notas, colores, rúbricas y PWA
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Construcción estática, cabeceras y trasvase cifrado
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Registrar inventario actualizado sin publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "Se esperaba cambio en inventario"; exit 1; }
          git commit -m "build: hashes de colores en modo alumno"
          git push origin HEAD:feat/student-category-colors-20261121
