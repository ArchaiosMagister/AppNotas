name: Rediseño aprobado - escritorio iPhone iPad
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redesign-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/redesign-responsive.browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redesign-ui-screenshots
          path: _redesign_ui/
          if-no-files-found: ignore
