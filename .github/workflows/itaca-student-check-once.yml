name: Validar Ítaca en cabecera del modo alumno (temporal)
on:
  push:
    branches: [feat/student-itaca-in-period-header-20261121]
    paths: [.github/workflows/itaca-student-check-once.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y manifiesto SHA-256
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/sw.js
          node --check app/tests/v124_itaca_student_summary.test.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Batería completa y regresiones de notas
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Compilación, seguridad y migración cifrada
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Versionar manifiesto actualizado sin publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "No se actualizaron hashes"; exit 1; }
          git commit -m "build: actualizar hashes para Nota Ítaca en modo alumno"
          git push origin HEAD:feat/student-itaca-in-period-header-20261121
