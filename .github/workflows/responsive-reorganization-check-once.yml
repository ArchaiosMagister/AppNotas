name: Validar rediseño B móvil y iPad (temporal)
# Chromium detectó visibilidad docente en modo alumno; comprobar corrección con CSS prioritario
on:
  push:
    branches: [feat/responsive-interface-reorganization-20261121]
    paths: [.github/workflows/responsive-reorganization-check-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JavaScript y manifiesto íntegro
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/sw.js
          node --check app/tests/v128_responsive_reorganization.test.mjs
          node --check app/tests/responsive-reorg.browser.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt > /dev/null)
      - name: Todas las pruebas de notas, criptografía, agenda y regresiones
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Validar empaquetado estático y migraciones
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Instalar motores de navegador de pruebas, sin modificar dependencias del proyecto
        run: |
          set -euo pipefail
          npm install --prefix app --no-save --no-package-lock playwright@1.56.1
          ./app/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Verificar responsividad y accesibilidad básica en Chromium y WebKit (iPad)
        run: |
          set -euo pipefail
          node app/tests/responsive-reorg.browser.mjs
      - name: Guardar inventario de recursos validado sin publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "El inventario no cambió"; exit 1; }
          git commit -m "build: recalcular hashes de la interfaz responsive v130"
          git push origin HEAD:feat/responsive-interface-reorganization-20261121
