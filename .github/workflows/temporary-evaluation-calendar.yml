name: 'Temporary audit - evaluation agenda and ICS'
on:
  push:
    branches:
      - feat/sesiones-evaluacion-calendario-20261122
    paths:
      - .github/workflows/temporary-evaluation-calendar.yml
permissions:
  contents: write
jobs:
  validate-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test evaluation agenda and general data integrity
        working-directory: app
        run: |
          node --test tests/v151_evaluation_calendar_sessions.test.mjs
          npm test
      - name: Rebuild autonomous HTML and hashes
        run: |
          npm install --location=global --no-audit --no-fund typescript@5
          node app/tools/build-standalone.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CuadernoDocente_sin_instalar.html app/MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: paquete autónomo de convocatorias y exportaciones ICS con CSP verificada"
            git push origin HEAD:refs/heads/feat/sesiones-evaluacion-calendario-20261122
          fi
