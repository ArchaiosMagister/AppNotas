name: Extraer fuentes auditadas a una rama (una sola vez)

on:
  push:
    branches: [refactor/source-tree-20261121]
    paths: [.github/workflows/bootstrap-source.yml]

permissions:
  contents: write

concurrency:
  group: appnotas-bootstrap-fuentes
  cancel-in-progress: false

jobs:
  extract:
    if: github.repository == 'ArchaiosMagister/AppNotas' && github.ref == 'refs/heads/refactor/source-tree-20261121'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de refactorización
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extraer ZIP verificado y aplicar auditoría
        run: |
          set -euo pipefail
          python3 scripts/export_source_tree.py
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Validar JavaScript
        run: |
          set -euo pipefail
          node --check app/src/planner-ui.js
          node --check app/app.js
          node --check app/sw.js
      - name: Probar correcciones de la auditoría
        env:
          CUADERNO_ROOT: app
        run: node --test scripts/audit-v119.test.mjs
      - name: Ejecutar las 362 pruebas originales
        working-directory: app
        run: npm test
      - name: Versionar fuentes en la rama, sin tocar main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force -- app/
          git diff --cached --stat
          git diff --cached --quiet && { echo "No hay cambios que versionar"; exit 1; }
          git commit -m "refactor: versionar fuentes PWA auditadas en app/"
          git push origin HEAD:refactor/source-tree-20261121
