name: 'Temporary patio XLSX rotation verification'
# Re-ejecutar tras reparar el simulador XML y el plegado ICS de la prueba.
on:
  push:
    branches:
      - feat/sesiones-evaluacion-calendario-20261122
    paths:
      - .github/workflows/temporary-patio-import.yml
permissions:
  contents: write
jobs:
  validate-and-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate import and encrypted notebook regressions
        working-directory: app
        run: |
          node --check src/planner.js
          node --check src/planner-ui.js
          node --check src/patio-rotation.js
          node --check app.js
          node --check sw.js
          node --test tests/v151_evaluation_calendar_sessions.test.mjs tests/v152_patio_excel_rotation.test.mjs
          npm test
      - name: Regenerate offline bundle and source inventory
        run: |
          npm install --location=global --no-audit --no-fund typescript@5
          node app/tools/build-standalone.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CuadernoDocente_sin_instalar.html app/MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerar HTML autónomo y SHA256 tras integrar Excel de guardias"
            git push origin HEAD:refs/heads/feat/sesiones-evaluacion-calendario-20261122
          fi
