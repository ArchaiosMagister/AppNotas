name: Validar y publicar CuadernoDocente v1.19

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appnotas-v119-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Reconstruir ZIP v1.19 y verificar SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release
          cat releases/v1.19/part_*.b64 | base64 --decode > _release/CuadernoDocente_v1.19.zip
          echo '85189a3b59a7e6829664d6b89fcb48b624761f963b023eb560fc0575861e8f29  _release/CuadernoDocente_v1.19.zip' | sha256sum --check
          unzip -q _release/CuadernoDocente_v1.19.zip -d _release
          ( cd _release/CuadernoDocente_v1.19-prepublicacion && sha256sum --check MANIFEST_SHA256.txt )
      - name: Aplicar reparaciones auditadas al paquete PWA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_v119_audit.py _release/CuadernoDocente_v1.19-prepublicacion
          ( cd _release/CuadernoDocente_v1.19-prepublicacion && sha256sum --check MANIFEST_SHA256.txt )
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript reparado
        working-directory: _release/CuadernoDocente_v1.19-prepublicacion
        run: node --check src/planner-ui.js
      - name: Probar cuatro correcciones y actualización PWA
        env:
          CUADERNO_ROOT: _release/CuadernoDocente_v1.19-prepublicacion
        run: node --test scripts/audit-v119.test.mjs
      - name: Ejecutar 362 pruebas automatizadas
        working-directory: _release/CuadernoDocente_v1.19-prepublicacion
        run: npm test
      - name: Construir PWA estatica de prueba
        shell: bash
        run: |
          set -euo pipefail
          source_dir=_release/CuadernoDocente_v1.19-prepublicacion
          mkdir -p _site/data
          cp "$source_dir"/{index.html,styles.css,app.js,sw.js,manifest.webmanifest} _site/
          cp -R "$source_dir"/icons "$source_dir"/src "$source_dir"/vendor _site/
          cp -R "$source_dir"/data/curriculos _site/data/
          touch _site/.nojekyll
          test -f _site/src/pwa-controls.js
          test -f _site/src/cuaderno.js
          test -f _site/src/storage.js
          test -f _site/vendor/jszip.min.js
          test -f _site/icons/apple-touch-icon.png
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          test -f _site/icons/icon-maskable-512.png
          test -f _site/data/curriculos/gr1y2-nuevo.pdf
          test -f _site/data/curriculos/lat1y2-nuevo.pdf
          test -f _site/data/curriculos/lat4.pdf
          test -f _site/data/curriculos/lat2-2022.pdf
          test "$(find _site -type f \( -name '*.cuaderno' -o -name '*.cdoc' -o -name '*.sqlite' -o -name '*.db' \) | wc -l)" -eq 0
      - name: Empaquetar PWA auditada tras pruebas
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ( cd _release && zip -q -r CuadernoDocente_v1.19_auditada.zip CuadernoDocente_v1.19-prepublicacion )
      - name: Conservar ZIP auditado verificable para testers
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CuadernoDocente-v1.19-auditada-ZIP-completo
          path: _release/CuadernoDocente_v1.19_auditada.zip
          if-no-files-found: error
      - name: Preparar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar PWA v1.19 tras pruebas satisfactorias
        id: deployment
        uses: actions/deploy-pages@v4
