name: Validar y publicar CuadernoDocente v1.17

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appnotas-v117-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Reconstruir ZIP v1.17 y verificar SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release
          cat releases/v1.17/part_*.b64 | base64 --decode > _release/CuadernoDocente_v1.17.zip
          echo 'b90c00e31a723756387b53309ff5a2bcd82787eca23461f23d9c50481fcf81be  _release/CuadernoDocente_v1.17.zip' | sha256sum --check
          unzip -q _release/CuadernoDocente_v1.17.zip -d _release
          ( cd _release/CuadernoDocente_v1.17-prepublicacion && sha256sum --check MANIFEST_SHA256.txt )
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ejecutar 348 pruebas automatizadas
        working-directory: _release/CuadernoDocente_v1.17-prepublicacion
        run: npm test
      - name: Construir PWA estatica de prueba
        shell: bash
        run: |
          set -euo pipefail
          source_dir=_release/CuadernoDocente_v1.17-prepublicacion
          mkdir -p _site/data
          cp "$source_dir"/{index.html,styles.css,app.js,sw.js,manifest.webmanifest} _site/
          cp -R "$source_dir"/icons "$source_dir"/src "$source_dir"/vendor _site/
          cp -R "$source_dir"/data/curriculos _site/data/
          touch _site/.nojekyll
          test -f _site/src/cuaderno.js
          test -f _site/src/storage.js
          test -f _site/vendor/jszip.min.js
          test -f _site/data/curriculos/gr1y2-nuevo.pdf
          test -f _site/data/curriculos/lat1y2-nuevo.pdf
          test -f _site/data/curriculos/lat4.pdf
          test -f _site/data/curriculos/lat2-2022.pdf
          ! find _site -name '*.cuaderno' -o -name '*.cdoc' | grep .
      - name: Conservar ZIP verificable para testers
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: CuadernoDocente-v1.17-ZIP-completo
          path: _release/CuadernoDocente_v1.17.zip
          if-no-files-found: error
      - name: Preparar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages (requiere sitio habilitado)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publicar PWA v1.17 tras pruebas satisfactorias
        id: deployment
        uses: actions/deploy-pages@v4
