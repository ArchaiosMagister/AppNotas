name: Validar AppNotas para Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appnotas-cloudflare-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Verificar árbol de fuentes y manifiesto
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_manifest.py --check
          ( cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null )
      - name: Comparar byte a byte con la PWA de la publicación anterior
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/source-tree-20261121'
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          CUADERNO_OUTPUT_DIR="$temp/reference" python3 scripts/export_source_tree.py
          diff -qr app "$temp/reference"
          ( cd "$temp/reference" && sha256sum --check MANIFEST_SHA256.txt >/dev/null )
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript reparado
        working-directory: app
        run: |
          node --check src/planner-ui.js
          node --check app.js
          node --check sw.js
      - name: Probar cuatro correcciones y actualización PWA
        env:
          CUADERNO_ROOT: app
        run: node --test scripts/audit-v119.test.mjs
      - name: Ejecutar 366 pruebas de aplicación y seguridad
        working-directory: app
        run: npm test
      - name: Construir sitio estático exclusivo para Cloudflare Pages
        run: node scripts/build-static-site.mjs
      - name: Comprobar alojamiento único, cabeceras y migración cifrada
        run: node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs scripts/cloudflare-only.test.mjs
      - name: Comprobar separación de despliegues y endpoints Dropbox
        run: node --test scripts/dropbox-deployment.test.mjs
      - name: Empaquetar fuentes versionadas para testers
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p _release
          zip -qr _release/CuadernoDocente_v1.19_fuentes.zip app
      - name: Conservar paquete de fuentes verificable
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AppNotas-v1.19-fuentes-verificadas
          path: _release/CuadernoDocente_v1.19_fuentes.zip
          if-no-files-found: error
