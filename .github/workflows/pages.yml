name: Validar y publicar AppNotas desde fuentes versionadas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appnotas-v119-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Verificar árbol de fuentes y manifiesto
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/source_manifest.py --check
          ( cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null )
      - name: Comparar byte a byte con la PWA de la publicación anterior
        if: github.event_name == 'pull_request' && github.head_ref == 'refactor/source-tree-20261121'
        shell: bash
        run: |
          set -euo pipefail
          temp="$(mktemp -d)"
          CUADERNO_OUTPUT_DIR="$temp/reference" python3 scripts/export_source_tree.py
          diff -qr app "$temp/reference"
          ( cd "$temp/reference" && sha256sum --check MANIFEST_SHA256.txt >/dev/null )
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript reparado
        working-directory: app
        run: |
          node --check src/planner-ui.js
          node --check app.js
          node --check sw.js
      - name: Probar cuatro correcciones y actualización PWA
        env:
          CUADERNO_ROOT: app
        run: node --test scripts/audit-v119.test.mjs
      - name: Ejecutar 366 pruebas de aplicación y seguridad
        working-directory: app
        run: npm test
      - name: Construir PWA estatica desde app/
        shell: bash
        run: |
          set -euo pipefail
          source_dir=app
          mkdir -p _site/data
          cp "$source_dir"/{index.html,styles.css,app.js,sw.js,manifest.webmanifest} _site/
          cp -R "$source_dir"/icons "$source_dir"/src "$source_dir"/vendor _site/
          cp -R "$source_dir"/data/curriculos _site/data/
          touch _site/.nojekyll
          test -f _site/src/pwa-controls.js
          test -f _site/src/cuaderno.js
          test -f _site/src/storage.js
          test -f _site/vendor/jszip.min.js
          test -f _site/icons/apple-touch-icon.png
          test -f _site/icons/icon-192.png
          test -f _site/icons/icon-512.png
          test -f _site/icons/icon-maskable-512.png
          test -f _site/data/curriculos/gr1y2-nuevo.pdf
          test -f _site/data/curriculos/lat1y2-nuevo.pdf
          test -f _site/data/curriculos/lat4.pdf
          test -f _site/data/curriculos/lat2-2022.pdf
          test "$(find _site -type f \( -name '*.cuaderno' -o -name '*.cdoc' -o -name '*.sqlite' -o -name '*.db' \) | wc -l)" -eq 0
      - name: Empaquetar fuentes versionadas para testers
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          mkdir -p _release
          zip -qr _release/CuadernoDocente_v1.19_fuentes.zip app
      - name: Conservar paquete de fuentes verificable
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: AppNotas-v1.19-fuentes-verificadas
          path: _release/CuadernoDocente_v1.19_fuentes.zip
          if-no-files-found: error
      - name: Preparar GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar AppNotas desde fuentes verificadas
        id: deployment
        uses: actions/deploy-pages@v4
