name: Actualizar manifiesto y probar política de copias (uso único)
on:
  push:
    branches: [feat/backup-assurance-20261121]
    paths: [.github/workflows/backup-manifest-once.yml]
permissions:
  contents: write
jobs:
  audit:
    if: github.repository == 'ArchaiosMagister/AppNotas' && github.ref == 'refs/heads/feat/backup-assurance-20261121'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Actualizar y verificar manifiesto de la fuente canónica
        run: |
          set -euo pipefail
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Comprobar scripts y Service Worker
        run: |
          node --check app/app.js
          node --check app/src/cuaderno.js
          node --check app/sw.js
      - name: Regresiones completas del cuaderno cifrado y de las notas
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Verificar empaquetado, cabeceras y migración cifrada
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Versionar solo manifiesto actualizado, sin publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --stat
          git diff --cached --quiet && { echo "Esperaba cambios en el manifiesto"; exit 1; }
          git commit -m "build: actualizar manifiesto SHA-256 tras auditoría de copias"
          git push origin HEAD:feat/backup-assurance-20261121
