name: Validar Safari, Enter, rúbricas y grupos (temporal)
on:
  push:
    branches: [fix/ipad-sw-student-view-orthography-20261121]
    paths: [.github/workflows/ipad-improvements-check-once.yml]
permissions:
  contents: write
jobs:
  tests:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis, manifiesto y SHA de la PWA
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/sw.js
          node --check app/src/model.js
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Tests de notas, rúbricas, faltas, Safari y modo alumno
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Construcción y pruebas de seguridad entre alojamientos
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Comprobar redirecciones reales de portada de Cloudflare (diagnóstico)
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          base="https://appnotas-docente.pages.dev"
          for rel in ("/","/index.html"):
              with urlopen(Request(base+rel,headers={"User-Agent":"Mozilla/5.0"}),timeout=20) as response:
                  print(f"{rel}: HTTP {response.status}, URL final={response.geturl()}, tipo={response.headers.get('Content-Type','')}")
          PY
      - name: Versionar únicamente el manifiesto regenerado, sin publicación
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "No se alteró manifiesto cuando debería"; exit 1; }
          git commit -m "build: inventario de SW y visor individual para iPad"
          git push origin HEAD:fix/ipad-sw-student-view-orthography-20261121
