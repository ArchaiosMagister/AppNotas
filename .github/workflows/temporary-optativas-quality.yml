name: 'Temporary quality gate optativas and agenda'
on:
  push:
    branches:
      - feat/agenda-optativas-colores-horas-20261122
    paths:
      - .github/workflows/temporary-optativas-quality.yml
permissions:
  contents: write
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed modules and build standalone
        run: |
          node --check app/src/model.js
          node --check app/src/planner.js
          node --check app/src/planner-ui.js
          node --check app/src/timetable-export.js
          node --check app/app.js
          npm install --location=global --no-audit --no-fund typescript@5
          node app/tools/build-standalone.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
      - name: Run entire calculation, backup and academic regression suite
        run: |
          cd app
          node --test tests/v153_optativas_colores_horas_subgrupos.test.mjs
          npm test
      - name: Commit validated offline bundle and source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/CuadernoDocente_sin_instalar.html app/MANIFEST_SHA256.txt
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerar distribución autónoma tras mejoras de grupos y horario"
            git push origin HEAD:refs/heads/feat/agenda-optativas-colores-horas-20261122
          fi
