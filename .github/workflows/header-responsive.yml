name: Cabecera adaptable Chromium y WebKit
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-header:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegadores de prueba
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verificar cabecera en 10 tamaños y 3 temas
        run: node scripts/header-responsive.browser.mjs
      - name: Conservar capturas de prueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-cabecera
          path: header-screenshots/
          if-no-files-found: ignore
