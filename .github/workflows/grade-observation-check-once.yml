name: Validar observaciones cifradas de calificaciones (temporal)
# Revalidar pruebas tras eliminar número de caché fijado en test anterior
on:
  push:
    branches: [feat/grade-observations-20261121]
    paths: [.github/workflows/grade-observation-check-once.yml]
permissions:
  contents: write
jobs:
  audit:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Revisar sintaxis y regenerar inventario SHA-256
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/src/model.js
          node --check app/sw.js
          node --check app/tests/v127_grade_observations.test.mjs
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Batería completa de notas, NP/AJ, rúbricas, observaciones y cifrado
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Verificar paquete estático y la migración de copias cifradas
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Actualizar inventario sin publicación
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "El manifiesto debería cambiar"; exit 1; }
          git commit -m "build: actualizar hashes de observaciones por calificación"
          git push origin HEAD:feat/grade-observations-20261121
