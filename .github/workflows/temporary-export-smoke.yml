name: Temporary document export smoke test
on:
  push:
    branches:
      - feat/horario-verano-exportacion-criterios-20261122
    paths:
      - .github/workflows/temporary-export-smoke.yml
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validators in temporary folders
        run: |
          mkdir -p /tmp/timetable-check
          npm install --prefix /tmp/timetable-check --no-fund --no-audit jszip@3.10.1
          python3 -m pip install --quiet --user pymupdf
      - name: Generate real DOCX and PDF in both modes
        run: |
          node --input-type=module <<'JS'
          import {createRequire} from 'node:module';
          import {writeFileSync} from 'node:fs';
          import {initialNotebook} from './app/src/model.js';
          import {activeYear,saveSlot,setSummerSchedule,scheduleBands} from './app/src/planner.js';
          import {timetablePdfBytes,timetableWordBlob} from './app/src/timetable-export.js';
          const require=createRequire(import.meta.url),JSZip=require('/tmp/timetable-check/node_modules/jszip');
          const doc=initialNotebook(),y=activeYear(doc);
          const b=scheduleBands(y)[0];
          saveSlot(doc,{day:0,start:b.start,end:b.end,bandId:b.id,type:'guardia',label:'Guardia biblioteca',room:'Aula 2.15',color:'#7C3AED'});
          for(const mode of ['ordinario','verano']){
            if(mode==='verano')setSummerSchedule(doc,true);
            const zip=await timetableWordBlob(doc,y,JSZip);
            writeFileSync('/tmp/timetable-check/'+mode+'.docx',new Uint8Array(await zip.arrayBuffer()));
            writeFileSync('/tmp/timetable-check/'+mode+'.pdf',timetablePdfBytes(doc,y));
          }
          JS
      - name: Open packages, parse OOXML, render PDF and check visible timetable
        run: |
          python3 - <<'PY'
          import fitz,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path('/tmp/timetable-check')
          for mode in ('ordinario','verano'):
            docx=root/(mode+'.docx')
            with zipfile.ZipFile(docx) as z:
              assert '[Content_Types].xml' in z.namelist()
              assert '_rels/.rels' in z.namelist()
              word=z.read('word/document.xml')
              ET.fromstring(word)
              assert b'Guardia biblioteca' in word
              assert b'Aula 2.15' in word
              assert (b'13:00' in word)==(mode=='verano')
            pdf=fitz.open(root/(mode+'.pdf'))
            assert len(pdf)==1
            page=pdf[0]
            assert page.rect.width>page.rect.height
            words=page.get_text()
            assert 'Guardia biblioteca' in words,words
            assert 'Aula 2.15' in words,words
            assert ('13:00' in words)==(mode=='verano')
            page.get_pixmap(matrix=fitz.Matrix(1.3,1.3)).save(str(root/(mode+'.png')))
            print(mode,docx.stat().st_size,(root/(mode+'.pdf')).stat().st_size,'bytes; text OK')
          PY
