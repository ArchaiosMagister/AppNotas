name: Comprobar despliegue de AppNotas en Cloudflare Pages

on:
  push:
    branches: [audit/cloudflare-live-20261121]
    paths: [.github/workflows/cloudflare-live-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Leer versión validada de main en rama de auditoría
        uses: actions/checkout@v4
      - name: Preparar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar manifiesto, construir sitio de referencia
        run: |
          set -euo pipefail
          python3 scripts/source_manifest.py --check
          node scripts/build-static-site.mjs
      - name: Comprobar origen, cabeceras y paridad de los 33 recursos HTTPS
        env:
          AUDIT_ORIGIN: https://appnotas-docente.pages.dev
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlsplit, urljoin
          import re

          origin=os.environ["AUDIT_ORIGIN"]
          assert origin=="https://appnotas-docente.pages.dev"
          assert origin!="https://archaiosmagister.github.io"
          base=origin+"/"
          req_headers={"User-Agent":"Mozilla/5.0 (compatible; AppNotasDeploymentAudit/1.0)"}
          def get(rel):
              url=urljoin(base,rel)
              if urlsplit(url).netloc!="appnotas-docente.pages.dev":
                  raise AssertionError("Recurso sale del origen aislado: "+url)
              with urlopen(Request(url,headers=req_headers),timeout=20) as resp:
                  if resp.status!=200:
                      raise AssertionError(f"{url}: HTTP {resp.status}")
                  if urlsplit(resp.geturl()).netloc!="appnotas-docente.pages.dev":
                      raise AssertionError("Redirige fuera del dominio dedicado")
                  return resp.read(),resp.headers
          html,head=get("")
          local=Path("dist/index.html").read_bytes()
          assert html==local, "La portada remota no corresponde a la versión auditada"
          policy=head.get("Content-Security-Policy","")
          assert "script-src 'self'" in policy, f"Falta script-src self: {policy}"
          assert "frame-ancestors 'none'" in policy, f"Falta protección HTTP de iframe: {policy}"
          assert "connect-src 'self'" in policy
          assert head.get("X-Frame-Options","").upper()=="DENY", "Falta X-Frame-Options DENY"
          assert head.get("X-Content-Type-Options","").lower()=="nosniff"
          assert head.get("Referrer-Policy","").lower()=="no-referrer"
          print("OK página HTTPS en origen distinto, mismo HTML, CSP, no iframe y no referrer")
          sw=Path("app/sw.js").read_text()
          assets=re.search(r"const ASSETS=\[([^\]]+)\]",sw)
          assert assets, "No se reconocen los archivos necesarios para offline"
          names=re.findall(r"'(\.[^']+)'",assets.group(1))
          assert len(names)==33, f"Esperados 33 recursos PWA, encontrados {len(names)}"
          checked=0
          for name in names:
              if name=="./":
                  continue
              rel=name.removeprefix("./")
              assert ".." not in rel and not rel.startswith("/")
              remote,headers=get(rel)
              original=Path("dist",rel).read_bytes()
              if remote!=original:
                  raise AssertionError(f"Archivo distinto /{rel}: remoto={hashlib.sha256(remote).hexdigest()} esperado={hashlib.sha256(original).hexdigest()}")
              print(f"OK /{rel} ({len(remote)} bytes)")
              checked+=1
          _,sw_headers=get("sw.js")
          assert "no-store" in sw_headers.get("Cache-Control",""),"El SW no tiene no-store HTTP"
          _,html_headers=get("index.html")
          assert "no-cache" in html_headers.get("Cache-Control",""),"El HTML no tiene no-cache"
          print(f"VERIFICADO: origen exclusivo, cabeceras HTTP, {checked} recursos exactos y caché PWA segura")
          PY
