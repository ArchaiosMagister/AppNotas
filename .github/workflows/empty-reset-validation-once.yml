name: Validar inicio vacío y reinicio protegido (temporal)
on:
  push:
    branches: [feat/empty-and-safe-reset-20261121]
    paths: [.github/workflows/empty-reset-validation-once.yml]
permissions:
  contents: write
jobs:
  validate:
    if: github.repository == 'ArchaiosMagister/AppNotas' && github.ref == 'refs/heads/feat/empty-and-safe-reset-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxis, seguridad de fuentes y actualizar inventario SHA-256
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/src/model.js
          node --check app/sw.js
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt > /dev/null)
      - name: Ejecutar todas las pruebas del cuaderno y de la conservación de calificaciones
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Verificar la distribución estática y migración cifrada
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Registrar inventario actualizado (sin publicación)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "Manifiesto no tenía cambios, inesperado"; exit 1; }
          git commit -m "build: actualizar hashes para modo vacío y reinicio protegido"
          git push origin HEAD:feat/empty-and-safe-reset-20261121
