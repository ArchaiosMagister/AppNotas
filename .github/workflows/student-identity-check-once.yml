name: Validar alumnos optativa y regenerar inventario (temporal)
# Revalidación: nombre largo histórico permanece en la lista sin presuponer orden
on:
  push:
    branches: [feat/student-surnames-origin-groups-20261121]
    paths: [.github/workflows/student-identity-check-once.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'ArchaiosMagister/AppNotas'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código y recrear hashes de la PWA
        run: |
          set -euo pipefail
          node --check app/app.js
          node --check app/src/model.js
          node --check app/src/csv.js
          node --check app/sw.js
          python3 scripts/source_manifest.py --write
          python3 scripts/source_manifest.py --check
          (cd app && sha256sum --check MANIFEST_SHA256.txt >/dev/null)
      - name: Ejecutar batería completa de cálculos, nombres, grupos, cifrado y copias
        run: |
          set -euo pipefail
          (cd app && npm test)
          CUADERNO_ROOT=app node --test scripts/audit-v119.test.mjs
      - name: Validar paquete Cloudflare/GitHub Pages y migración cifrada
        run: |
          set -euo pipefail
          node scripts/build-static-site.mjs
          node --test scripts/dedicated-hosting.test.mjs scripts/backup-origin-migration.test.mjs
      - name: Confirmar nuevo inventario reproducible sin publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/MANIFEST_SHA256.txt
          git diff --cached --quiet && { echo "Manifiesto no cambió cuando se esperaba"; exit 1; }
          git commit -m "build: actualizar inventario SHA-256 de identidad y grupo de alumnos"
          git push origin HEAD:feat/student-surnames-origin-groups-20261121
